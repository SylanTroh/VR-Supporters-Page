# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs only on publish event
  repository_dispatch:
      types: [publish]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write Lists
        shell: bash
        run: |
            mkdir site
            touch site/.nojekyll
            jq -r '.client_payload.files | keys[]' "$GITHUB_EVENT_PATH" | while read -r f; do
              case "$f" in .*|*[!A-Za-z0-9._-]*) echo "refusing file name"; exit 1 ;; esac
              jq -j --arg f "$f" '.client_payload.files[$f]' "$GITHUB_EVENT_PATH" > "site/$f"
            done
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload only the lists
          path: 'site'
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
